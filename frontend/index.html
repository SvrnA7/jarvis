<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; color: #9fd8ff;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #orb { position: fixed; inset: 0; }
    #hud { position: fixed; left: 0; right: 0; bottom: 6vh; text-align: center;
      pointer-events: none; padding: 0 16px; }
    #status { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; opacity: .6; }
    #you { margin-top: 10px; font-size: 15px; opacity: .55; min-height: 1.3em; }
    #say { margin-top: 6px; font-size: 20px; min-height: 1.4em; text-shadow: 0 0 12px #2a8cff; }
    #start { position: fixed; inset: 0; display: grid; place-items: center;
      background: rgba(2,4,10,.7); cursor: pointer; font-size: 14px;
      letter-spacing: .3em; text-transform: uppercase; }
  </style>
</head>
<body>
  <canvas id="orb"></canvas>
  <div id="hud">
    <div id="status">bereit</div>
    <div id="you"></div>
    <div id="say"></div>
  </div>
  <div id="start">Klicken zum Starten</div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
